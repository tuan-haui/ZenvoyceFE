        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-surface-background min-h-screen flex items-center justify-center p-container-padding font-body-md text-body-md text-text-body antialiased">
<div class="bg-surface-card border border-border-base rounded-lg w-full max-w-[380px] p-stack-lg shadow-sm">
<div class="text-center mb-stack-lg flex flex-col items-center">
<h1 class="font-h1 text-h1 text-primary tracking-tight mb-1">Zenvoyce</h1>
<p class="font-body-md text-body-md text-text-secondary">Sign in to Admin Console</p>
</div>
<form class="flex flex-col gap-stack-md">
<div class="flex flex-col gap-[4px]">
<label class="font-body-md text-body-md text-text-heading" for="username">Username</label>
<input class="w-full bg-surface-card border border-border-base rounded px-3 py-2 font-body-md text-body-md text-text-heading focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-text-secondary/50" id="username" placeholder="admin@zenvoyce.com" type="text"/>
</div>
<div class="flex flex-col gap-[4px]">
<label class="font-body-md text-body-md text-text-heading" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-card border border-border-base rounded pl-3 pr-10 py-2 font-body-md text-body-md text-text-heading focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-text-secondary/50" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-text-secondary hover:text-text-heading flex items-center justify-center transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility" style="font-size: 18px;">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-[-8px]">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 border-border-base rounded text-primary focus:ring-primary bg-surface-card transition-colors" type="checkbox"/>
<span class="font-body-md text-body-md text-text-body group-hover:text-text-heading transition-colors">Remember me</span>
</label>
<a class="font-body-md text-body-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<button class="w-full bg-primary text-on-primary font-body-md text-body-md rounded py-2 mt-base hover:bg-primary-container active:bg-primary-fixed-variant transition-colors shadow-sm" type="submit">
                Login
            </button>
</form>
</div>
</body></html>
